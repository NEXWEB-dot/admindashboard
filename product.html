<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Editor — ANRAF Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    @media (min-width: 768px) {
      .form-grid { grid-template-columns: 2fr 1fr; }
    }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; text-transform: uppercase; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 4px; font-size: 0.95rem;
    }
    .image-dropzone {
      border: 2px dashed var(--color-border); padding: 2rem; text-align: center; border-radius: 4px; cursor: pointer; background: var(--color-cream);
      margin-bottom: 1.5rem;
    }
    .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .image-item { position: relative; aspect-ratio: 3/4; border: 1px solid var(--color-border); border-radius: 4px; overflow: hidden; }
    .image-item img { width: 100%; height: 100%; object-fit: cover; }
    .image-remove { position: absolute; top: 4px; right: 4px; background: rgba(185, 28, 28, 0.85); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; line-height: 1; }
    .btn { padding: 0.75rem 1.75rem; border-radius: 3px; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn-dark { background: var(--color-near-black); color: #fff; border: 1px solid var(--color-near-black); }
  </style>
</head>
<body>
  <div class="admin-container">
    <a href="/admin/products.html" style="font-size: 0.85rem; text-decoration: underline; margin-bottom: 1rem; display: inline-block;">← Back to Products</a>
    <h1 id="page-title" style="font-family: var(--font-serif); font-size: 2rem;">Add New Product</h1>

    <div id="status-banner"></div>

    <form id="product-form">
      <div class="form-grid">
        <div>
          <div class="form-group">
            <label for="name">Product Name *</label>
            <input type="text" id="name" required placeholder="e.g. Embroidered Lawn Suit — Noir">
          </div>

          <div class="form-group">
            <label for="slug">Slug (URL Keyword) *</label>
            <input type="text" id="slug" required placeholder="e.g. embroidered-lawn-suit-noir">
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="6" placeholder="Fabric details, embroidery specifications, care instructions…"></textarea>
          </div>

          <div class="form-group">
            <label>Product Images (Up to 10)</label>
            <div class="image-dropzone" id="dropzone">
              <p>Drag & drop images here or <u>browse files</u></p>
              <small style="color: var(--color-muted);">PNG, JPEG, WebP. Converted automatically to optimized WebP.</small>
              <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
            </div>
            <div class="images-grid" id="images-preview"></div>
          </div>
        </div>

        <div>
          <div class="form-group">
            <label for="price">Price (PKR) *</label>
            <input type="number" id="price" required min="0" step="1" placeholder="12500">
          </div>

          <div class="form-group">
            <label for="compare_at_price">Compare-at Price (Original/Was)</label>
            <input type="number" id="compare_at_price" min="0" step="1" placeholder="15000">
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" list="category-suggestions" placeholder="e.g. Lawn, Embroidery, Heritage">
            <datalist id="category-suggestions">
              <option value="Lawn">
              <option value="Embroidery">
              <option value="Heritage">
            </datalist>
          </div>

          <div class="form-group" style="margin-top: 1.5rem; background: var(--color-cream); padding: 1rem; border-radius: 4px;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="in_stock" checked>
              <span>In Stock (Available for purchase)</span>
            </label>
          </div>

          <div class="form-group" style="background: var(--color-cream); padding: 1rem; border-radius: 4px;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-bottom: 0.5rem;">
              <input type="checkbox" id="track_stock">
              <span>Track Exact Inventory Units</span>
            </label>
            <div id="stock-container" style="display: none; margin-top: 0.75rem;">
              <label for="stock">Available Quantity</label>
              <input type="number" id="stock" min="0" value="0">
            </div>
          </div>

          <div class="form-group" style="background: var(--color-cream); padding: 1rem; border-radius: 4px;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="is_active" checked>
              <span>Publish to Storefront</span>
            </label>
          </div>

          <button type="submit" id="save-btn" class="btn btn-dark" style="width: 100%; margin-top: 1rem;">Save Product</button>
        </div>
      </div>
    </form>
  </div>

  <script type="module">
    import { api, slugify, toWebP, initStatusBanner, toast } from '/admin/js/api.js';

    initStatusBanner();

    const productId = new URLSearchParams(location.search).get('id');
    let images = [];

    const nameInput = document.getElementById('name');
    const slugInput = document.getElementById('slug');
    const trackStockCheck = document.getElementById('track_stock');
    const stockContainer = document.getElementById('stock-container');

    trackStockCheck.addEventListener('change', () => {
      stockContainer.style.display = trackStockCheck.checked ? 'block' : 'none';
    });

    if (!productId) {
      nameInput.addEventListener('input', () => {
        slugInput.value = slugify(nameInput.value);
      });
    }

    async function loadProduct() {
      if (!productId) return;
      document.getElementById('page-title').textContent = 'Edit Product';
      try {
        const snap = await api.products.list();
        const p = (snap.products || []).find(item => item.id === productId);
        if (!p) throw new Error('Product not found in snapshot');

        nameInput.value = p.name || '';
        slugInput.value = p.slug || '';
        document.getElementById('description').value = p.description || '';
        document.getElementById('price').value = p.price || 0;
        document.getElementById('compare_at_price').value = p.compare_at_price || '';
        document.getElementById('category').value = p.category || '';
        document.getElementById('in_stock').checked = p.in_stock !== false;
        document.getElementById('is_active').checked = p.is_active !== false;
        trackStockCheck.checked = !!p.track_stock;
        stockContainer.style.display = p.track_stock ? 'block' : 'none';
        document.getElementById('stock').value = p.stock || 0;

        images = p.images || [];
        renderImages();
      } catch (e) {
        toast(`Error loading product: ${e.message}`, 'error');
      }
    }

    function renderImages() {
      const preview = document.getElementById('images-preview');
      preview.innerHTML = '';
      images.forEach((img, idx) => {
        const div = document.createElement('div');
        div.className = 'image-item';

        const imgEl = document.createElement('img');
        imgEl.src = img.thumb || img.url;
        div.appendChild(imgEl);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'image-remove';
        btn.textContent = '×';
        btn.addEventListener('click', () => {
          images.splice(idx, 1);
          renderImages();
        });
        div.appendChild(btn);

        preview.appendChild(div);
      });
    }

    // Image upload handling
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFiles);
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#000'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = ''; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '';
      if (e.dataTransfer.files) handleFiles({ target: { files: e.dataTransfer.files } });
    });

    async function handleFiles(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      toast(`Processing ${files.length} images…`, 'info');
      for (const file of files) {
        if (images.length >= 10) {
          toast('Maximum 10 images allowed per product', 'warning');
          break;
        }
        try {
          const { full, thumb } = await toWebP(file);
          const uploadRes = await api.uploadImage(full, thumb);
          images.push(uploadRes);
          renderImages();
        } catch (err) {
          toast(`Image upload failed: ${err.message}`, 'error');
        }
      }
    }

    // Form submit
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';

      const payload = {
        name: nameInput.value.trim(),
        slug: slugInput.value.trim(),
        description: document.getElementById('description').value.trim() || null,
        price: Number(document.getElementById('price').value),
        compare_at_price: document.getElementById('compare_at_price').value ? Number(document.getElementById('compare_at_price').value) : null,
        category: document.getElementById('category').value.trim() || null,
        in_stock: document.getElementById('in_stock').checked,
        track_stock: trackStockCheck.checked,
        stock: trackStockCheck.checked ? Number(document.getElementById('stock').value) : 0,
        is_active: document.getElementById('is_active').checked,
        images: images
      };

      try {
        let res;
        if (productId) {
          res = await api.products.update(productId, payload);
        } else {
          res = await api.products.create(payload);
        }

        if (res.mode === 'emergency') {
          toast('Saved in Emergency Mode (R2 updated; will sync when DB returns)', 'warning', 6000);
        } else {
          toast('Product saved successfully!', 'success');
        }

        setTimeout(() => { window.location.href = '/admin/products.html'; }, 1000);
      } catch (err) {
        toast(`Save error: ${err.message}`, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Product';
      }
    });

    loadProduct();
  </script>
</body>
</html>
