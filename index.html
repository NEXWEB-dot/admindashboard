<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ANRAF Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-nav { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem; margin-bottom: 2rem; }
    .admin-nav a { font-weight: 500; font-size: 0.95rem; }
    .admin-nav a.active { color: var(--color-gold-dark); border-bottom: 2px solid var(--color-gold); padding-bottom: 4px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--color-cream); padding: 1.5rem; border-radius: 4px; border: 1px solid var(--color-border-light); }
    .stat-label { font-size: 0.8rem; text-transform: uppercase; color: var(--color-muted); letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .stat-value { font-size: 1.8rem; font-family: var(--font-serif); font-weight: 600; color: var(--color-near-black); }
    .action-bar { display: flex; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
    .btn { padding: 0.75rem 1.5rem; border-radius: 3px; font-size: 0.85rem; font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn-dark { background: var(--color-near-black); color: #fff; border: 1px solid var(--color-near-black); }
    .btn-outline { background: transparent; border: 1px solid var(--color-border); }
    .table-section { margin-top: 2rem; }
    .table-section h2 { font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border-light); font-size: 0.9rem; }
    th { background: var(--color-cream); font-weight: 500; }
  </style>
</head>
<body>
  <div class="admin-container">
    <header style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem;">
      <h1 style="font-family: var(--font-serif); font-size: 2rem;">ANRAF Studio Admin</h1>
      <a href="/store.html" target="_blank" style="font-size: 0.85rem; text-decoration: underline;">View Live Store ↗</a>
    </header>

    <nav class="admin-nav">
      <a href="/admin/index.html" class="active">Overview</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/orders.html">Orders</a>
    </nav>

    <div id="status-banner"></div>

    <div class="action-bar">
      <button id="sync-btn" class="btn btn-dark">Sync Storefront Now</button>
      <button id="toggle-checkout-btn" class="btn btn-outline">Loading Switch…</button>
      <a href="/admin/product.html" class="btn btn-dark" style="margin-left: auto;">+ New Product</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Catalog Products</div>
        <div class="stat-value" id="stat-products">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Orders</div>
        <div class="stat-value" id="stat-pending-orders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Stock Alerts</div>
        <div class="stat-value" id="stat-low-stock">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">System Mode</div>
        <div class="stat-value" id="stat-mode" style="text-transform: capitalize;">—</div>
      </div>
    </div>

    <div class="table-section">
      <h2>Low Stock Items</h2>
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock Left</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="low-stock-tbody">
          <tr><td colspan="5" style="text-align: center; color: var(--color-muted);">Loading inventory…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { api, initStatusBanner, toast, formatPrice } from '/admin/js/api.js';

    initStatusBanner();

    let checkoutPaused = false;

    async function loadData() {
      try {
        const [status, productsData, ordersData] = await Promise.all([
          api.status(),
          api.products.list(),
          api.orders.list({ status: 'pending', limit: 1 }).catch(() => ({ total: '—' }))
        ]);

        document.getElementById('stat-mode').textContent = status.mode || 'Normal';
        document.getElementById('stat-products').textContent = productsData.count ?? productsData.products?.length ?? 0;
        document.getElementById('stat-pending-orders').textContent = ordersData.total ?? '0';

        checkoutPaused = !!status.checkoutPaused;
        const toggleBtn = document.getElementById('toggle-checkout-btn');
        toggleBtn.textContent = checkoutPaused ? 'Resume Checkout' : 'Pause Checkout (Kill Switch)';
        toggleBtn.style.color = checkoutPaused ? '#b91c1c' : '';

        // Low stock detection
        const lowStock = (productsData.products || []).filter(p => p.track_stock && p.stock <= 5);
        document.getElementById('stat-low-stock').textContent = lowStock.length;

        const tbody = document.getElementById('low-stock-tbody');
        tbody.innerHTML = '';
        if (!lowStock.length) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5" style="text-align: center; color: var(--color-muted);">All inventory levels are healthy.</td>';
          tbody.appendChild(tr);
        } else {
          for (const p of lowStock) {
            const tr = document.createElement('tr');
            
            const tdName = document.createElement('td');
            tdName.textContent = p.name;
            tr.appendChild(tdName);

            const tdCat = document.createElement('td');
            tdCat.textContent = p.category || '—';
            tr.appendChild(tdCat);

            const tdPrice = document.createElement('td');
            tdPrice.textContent = formatPrice(p.price);
            tr.appendChild(tdPrice);

            const tdStock = document.createElement('td');
            tdStock.textContent = `${p.stock} units`;
            tdStock.style.color = p.stock === 0 ? '#b91c1c' : '#a05c00';
            tdStock.style.fontWeight = '600';
            tr.appendChild(tdStock);

            const tdAction = document.createElement('td');
            const a = document.createElement('a');
            a.href = `/admin/product.html?id=${p.id}`;
            a.textContent = 'Edit Stock';
            a.style.textDecoration = 'underline';
            tdAction.appendChild(a);
            tr.appendChild(tdAction);

            tbody.appendChild(tr);
          }
        }
      } catch (e) {
        toast(`Error loading dashboard: ${e.message}`, 'error');
      }
    }

    document.getElementById('sync-btn').addEventListener('click', async () => {
      const btn = document.getElementById('sync-btn');
      btn.disabled = true;
      btn.textContent = 'Syncing…';
      try {
        const res = await api.sync();
        toast(`Storefront synced successfully (${res.count} products)`, 'success');
      } catch (e) {
        toast(`Sync failed: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sync Storefront Now';
      }
    });

    document.getElementById('toggle-checkout-btn').addEventListener('click', async () => {
      const btn = document.getElementById('toggle-checkout-btn');
      btn.disabled = true;
      try {
        const res = await api.checkoutToggle(!checkoutPaused);
        checkoutPaused = res.paused;
        btn.textContent = checkoutPaused ? 'Resume Checkout' : 'Pause Checkout (Kill Switch)';
        btn.style.color = checkoutPaused ? '#b91c1c' : '';
        toast(checkoutPaused ? 'Checkout PAUSED' : 'Checkout RESUMED', checkoutPaused ? 'warning' : 'success');
      } catch (e) {
        toast(`Toggle failed: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    loadData();
  </script>
</body>
</html>
